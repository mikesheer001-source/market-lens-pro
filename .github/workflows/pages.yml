name: Build, test and deploy Market Lens Pro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/server-scan.spec.js
      - run: npx playwright test e2e/options-pnl-overlay.spec.js
      - run: npx playwright test e2e/options-vertical.spec.js
      - run: npx playwright test e2e/chart-history.spec.js
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              | jq -e --arg name "$PAGES_ARTIFACT" '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' >/dev/null; then
              # The Pages deploy action uses a separate artifact lookup service.
              # REST visibility alone does not guarantee that service can see it yet.
              echo "Pages artifact registered; allowing 30 seconds for propagation."
              sleep 30
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Pages artifact did not register"
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify the deployed public site
        env:
          PLAYWRIGHT_BASE_URL: https://mikesheer001-source.github.io/market-lens-pro/
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::GitHub Pages did not become reachable after deployment"
              exit 1
            fi
            sleep 5
          done
          npx playwright test e2e/deployed.spec.js
          REAL_ALPACA_TEST=1 npx playwright test e2e/real-live.spec.js

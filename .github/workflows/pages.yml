name: Build, test and deploy Market Lens Pro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the deployed public site
        env:
          PLAYWRIGHT_BASE_URL: https://mikesheer001-source.github.io/market-lens-pro/
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::GitHub Pages did not become reachable after deployment"
              exit 1
            fi
            sleep 5
          done
          npx playwright test e2e/deployed.spec.js
          REAL_ALPACA_TEST=1 npx playwright test e2e/real-live.spec.js
